<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alis Art & Aura Atelier</title>

    <!-- Navigation stylesheet -->
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #000000, #3533CD);
            color: white;
            font-family: Georgia, serif;
        }

        .hero {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero-content {
            max-width: 800px;
        }

        .brand {
            font-size: 18px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
            color: #C90DEA;
        }

        h1 {
            font-size: 55px;
            line-height: 1.1;
            margin-bottom: 25px;
        }

        .tagline {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            border: 1px solid #C90DEA;
            background: #C90DEA;
            color: white;
            text-decoration: none;
            letter-spacing: 2px;
            transition: 0.3s;
            box-shadow: 0 0 15px #C90DEA;
        }

        .button:hover {
            background: #33CEEF;
            color: #000000;
            border-color: #33CEEF;
            box-shadow: 0 0 15px #33CEEF;
        }
    </style>
</head>

<body>

    <!-- WEBSITE NAVIGATION -->

    <nav class="navbar">

        <a href="index.html" class="nav-brand">
            Alis Art & Aura Atelier
        </a>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="who-we-are.html">Who We Are</a>

            <a href="what-we-create.html">What We Create</a>

            <a href="custom-orders.html">Custom Orders</a>

            <a href="contact.html">Contact</a>

        </div>

    </nav>


    <!-- HOMEPAGE HERO -->

    <section class="hero">

        <div class="hero-content">

            <div class="brand">
                Alis Art & Aura Atelier
            </div>

            <h1>
                Art That Means Something.
            </h1>

            <p class="tagline">
                Transforming words, emotions, memories and meaningful
                experiences into original art, gifts and beautiful spaces.
            </p>

            <a href="what-we-create.html" class="button">
                Explore the Atelier
            </a>

        </div>

    </section>
